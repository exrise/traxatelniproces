name: Сборка

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Тесты логики (без графики)
        run: go test ./internal/sim ./internal/balance ./internal/ai ./internal/netplay ./internal/gfx ./internal/sfx
      - name: Проверка кода под Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Сборка SvinoVoyna.exe
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-H=windowsgui -s -w" -o dist/SvinoVoyna.exe ./cmd/svinovoyna
          cp README.md dist/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: SvinoVoyna-windows
          path: dist/
